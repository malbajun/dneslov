types:
 - name: name
   model: Nomen
   version: 0.1
   by: root
   with:
    - tags
   fields:
    - name: id
      kind: number
      descriptions: :tiun.types.name.id
    - name: text
      kind: integer
      descriptions: :tiun.types.name.text
    - name: language_code
      kind: string
      descriptions: :tiun.types.name.language_code
    - name: alphabeth_code
      kind: string
