    - name: bind_kind_name
      kind: string
      descriptions: :tiun.types.name.bind_kind_name
    - name: rules
      kind: string array
      descriptions: :tiun.types.name.rules
    - name: tags
      kind: tag_ac array
      descriptions: :tiun.types.name.tags
 - name: nomen
   version: 0.1
   with:
