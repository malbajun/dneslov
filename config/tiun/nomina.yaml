    - name: language
      kind: string
      descriptions: :tiun.types.nomen.language
    - name: alphabeth
      kind: string
      descriptions: :tiun.types.nomen.alphabeth
    - name: bond_to_id
      kind: integer
      descriptions: :tiun.types.nomen.bond_to_id
    - name: root_id
      kind: integer
      descriptions: :tiun.types.nomen.root_id
    - name: bond_to_name
      kind: integer
      descriptions: :tiun.types.nomen.bond_to_name
    - name: root_name
      kind: integer
      descriptions: :tiun.types.nomen.root_name
