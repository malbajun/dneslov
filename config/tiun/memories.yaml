---
types:
 - name: memory_span
   model: Memory
   version: 0.1
   with:
    - pure_slug
    - memoed
    - title
    - note
    - short_name
   fields:
    - name: id
      kind: number
      descriptions: :tiun.types.memory.id
    - name: slug
      kind: string
      descriptions: :tiun.types.memory.slug
    - name: event_id
      kind: integer
      descriptions: :tiun.types.memory.event_id
    - name: usual_event_code
      kind: string
      descriptions: :tiun.types.memory.usual_event_code
    - name: order_short_name
      kind: string
      descriptions: :tiun.types.memory.order_short_name
    - name: order_title
      kind: string
      descriptions: :tiun.types.memory.order_title
    - name: order_tweet
      kind: string
      descriptions: :tiun.types.memory.order_tweet
    - name: roundel_url
      kind: url
      descriptions: :tiun.types.memory.roundel_url
    - name: title
      kind: string
      descriptions: :tiun.types.memory.title
    - name: note
      kind: string
      descriptions: :tiun.types.memory.note
    - name: happened_at
      kind: string
      descriptions: :tiun.types.memory.happened_at
    - name: base_year
      kind: number
      descriptions: :tiun.types.memory.base_year
    - name: short_name
      kind: string
      descriptions: :tiun.types.memory.short_name
    - name: type
      kind: enum <Building, Concept, Council, Group, Identity, Order, Place, Subsisten, Thing>
      descriptions: :tiun.types.memory.type
    - name: kind
      kind: enum <Chains, Icon, Belt, Shroud, Wilderness, Village, Settlement, Town, City, Monastery, World, Church, Cathedral, Chapel, Soul, Society, Worldie, Navia, Appear>
      descriptions: :tiun.types.memory.kind

    - name: calendary_slugs
      kind: string array
      descriptions: :tiun.types.memory.calendary_slugs
 - name: memory
   model: Memory
   version: 0.1
   with:
    - pure_slug
    - memoed
    - short_name
    - title
    - description
    - note
    - tweet
    - links
    - memory_names
   fields:
    - name: id
      kind: integer
      descriptions: :tiun.types.memory.id
    - name: slug
      kind: string
      descriptions: :tiun.types.memory.slug
    - name: short_name
      kind: string
      descriptions: :tiun.types.memory.short_name
    - name: quantity
      kind: string
      descriptions: :tiun.types.memory.quantity
    - name: base_year
      kind: integer
      descriptions: :tiun.types.memory.base_year
    - name: type
      kind: enum <Building, Concept, Council, Group, Identity, Order, Place, Subsisten, Thing>
      descriptions: :tiun.types.memory.type
    - name: kind
      kind: enum <Chains, Icon, Belt, Shroud, Wilderness, Village, Settlement, Town, City, Monastery, World, Church, Cathedral, Chapel, Soul, Society, Worldie, Navia, Appear>
      descriptions: :tiun.types.memory.kind
    - name: title
      kind: string
      descriptions: :tiun.types.memory.title
    - name: description
      kind: string
      descriptions: :tiun.types.memory.description
    - name: order_short_name
      kind: string
      descriptions: :tiun.types.memory.order_short_name
    - name: order_tweet
      kind: string
      descriptions: :tiun.types.memory.order_tweet
    - name: roundel_url
      kind: url
      descriptions: :tiun.types.memory.roundel_url
 - name: memory_ac
   model: Memory
   version: 0.1
   with:
    - key
    - value
   fields:
    - name: key
      kind: string
      readonly: true
      descriptions: :tiun.types.memory_ac.key
    - name: value
      kind: string
      readonly: true
      descriptions: :tiun.types.memory_ac.value
resources:
 - name: memory.index
   path: /api/v0/memories.json
   methods:
    - name: get
      version: 0.1
      kind: memory_span page
      descriptions: :tiun.resources.memory.index
      auth: no
      allowed_errors: [200, 204, 206, 416, 422.3, 500]
      args:
       - name: per
         kind: natural
         default: 10
         maximum: 50
         descriptions: :tiun.resources.memory.index.per_page
       - name: page
         kind: natural
         alias: p
         default: 1
         descriptions: :tiun.resources.memory.index.page
       - name: uno
         kind: string
         descriptions: :tiun.resources.memory.index.uno
       - name: title
         kind: string
         alias: tt
         descriptions: :tiun.resources.memory.index.title
       - name: description
         kind: string
         alias: d
         descriptions: :tiun.resources.memory.index.description
       - name: type
         kind: string
         alias: t
         descriptions: :tiun.resources.memory.index.type
       - name: kind
         kind: string
         alias: k
         descriptions: :tiun.resources.memory.index.kind
 - name: memory.autocomplete
   path: /api/v0/memories/ac.json
   methods:
    - name: get
      version: 0.1
      kind: memory_ac page
      descriptions: :tiun.resources.memory.autocomplete
      allowed_errors: [200, 204, 206, 422.3, 500]
      args:
       - name: per
         kind: natural
         default: 500
         maximum: 500
         descriptions: :tiun.resources.memory.autocomplete.per_page
       - name: query
         kind: string
         alias: q
         descriptions: :tiun.resources.memory.autocomplete.query
       - name: type
         kind: string
         alias: t
         descriptions: :tiun.resources.memory.autocomplete.type
       - name: language
         kind: string
         descriptions: :tiun.resources.memory.create.language
       - name: alphabeth
         kind: string
         descriptions: :tiun.resources.memory.create.alphabeth
 - name: memory.create
   path: /api/v0/memories/create.json
   methods:
    - name: post
      version: 0.1
      kind: memory
      descriptions: :tiun.resources.memory.create
      auth: memory.create
      allowed_errors: [200, 404, 422.3, 500]
      args:
       - name: id
         kind: integer
         descriptions: :tiun.resources.memory.create.id
       - name: slug
         kind: string
         descriptions: :tiun.resources.memory.create.slug
       - name: short_name
         kind: string
         descriptions: :tiun.resources.memory.create.short_name
       - name: quantity
         kind: string
         descriptions: :tiun.resources.memory.create.quantity
       - name: base_year
         kind: integer
         descriptions: :tiun.resources.memory.create.base_year
       - name: type
         kind: enum <Building, Concept, Council, Group, Identity, Order, Place, Subsisten, Thing>
         descriptions: :tiun.resources.memory.create.type
       - name: kind
         kind: string
         descriptions: :tiun.resources.memory.create.kind
       - name: council
         kind: string
         descriptions: :tiun.resources.memory.create.council
       - name: significance
         kind: string
         descriptions: :tiun.resources.memory.create.significance
       - name: language
         kind: string
         descriptions: :tiun.resources.memory.create.language
       - name: alphabeth
         kind: string
         descriptions: :tiun.resources.memory.create.alphabeth
       - name: short_name
         kind: string
         descriptions: :tiun.resources.memory.create.short_name
       - name: coverings
         kind: memory_uno array
         descriptions: :tiun.resources.memory.create.coverings
       - name: memory_binds
         kind: memory_uno array
         descriptions: :tiun.resources.memory.create.memory_binds
       - name: tweet
         kind: string
         descriptions: :tiun.resources.memory.create.tweet
       - name: note
         kind: string
         descriptions: :tiun.resources.memory.create.note
       - name: description
         kind: string
         descriptions: :tiun.resources.memory.create.description
       - name: links
         kind: uri array
         descriptions: :tiun.resources.memory.create.links
       - name: memory_names
         kind: memory_name array
         descriptions: :tiun.resources.memory.create.memory_names
 - name: memory
   path: /api/v0/memories/:uno.json
   methods:
    - name: get
      version: 0.1
      kind: memory
      descriptions: :tiun.resources.memory.get
      auth: no
      allowed_errors: [200, 404, 406, 422.3, 500]
      args:
       - name: uno
         kind: string
         descriptions: :tiun.resources.memory.get.uno
       - name: l
         kind: string
         alias: language
         descriptions: :tiun.resources.memory.get.language
       - name: a
         kind: string
         alias: alphabeth
         descriptions: :tiun.resources.memory.get.alphabeth
    - name: put
      version: 0.1
      kind: memory
      descriptions: :tiun.resources.memory.put
      auth: memory.update
      allowed_errors: [200, 404, 422.3, 500]
      args:
       - name: id
         kind: integer
         descriptions: :tiun.resources.memory.put.id
       - name: slug
         kind: string
         descriptions: :tiun.resources.memory.put.slug
       - name: short_name
         kind: string
         descriptions: :tiun.resources.memory.put.short_name
       - name: quantity
         kind: string
         descriptions: :tiun.resources.memory.put.quantity
       - name: base_year
         kind: integer
         descriptions: :tiun.resources.memory.put.base_year
       - name: type
         kind: enum <Building, Concept, Council, Group, Identity, Order, Place, Subsisten, Thing>
         descriptions: :tiun.resources.memory.put.type
       - name: kind
         kind: string
         descriptions: :tiun.resources.memory.put.kind
       - name: council
         kind: string
         descriptions: :tiun.resources.memory.put.council
       - name: significance
         kind: string
         descriptions: :tiun.resources.memory.put.significance
       - name: language
         kind: string
         descriptions: :tiun.resources.memory.put.language
       - name: alphabeth
         kind: string
         descriptions: :tiun.resources.memory.put.alphabeth
       - name: short_name
         kind: string
         descriptions: :tiun.resources.memory.put.short_name
       - name: coverings
         kind: memory_uno array
         descriptions: :tiun.resources.memory.put.coverings
       - name: memory_binds
         kind: memory_uno array
         descriptions: :tiun.resources.memory.put.memory_binds
       - name: tweet
         kind: string
         descriptions: :tiun.resources.memory.put.tweet
       - name: note
         kind: string
         descriptions: :tiun.resources.memory.put.note
       - name: description
         kind: string
         descriptions: :tiun.resources.memory.put.description
       - name: links
         kind: uri array
         descriptions: :tiun.resources.memory.put.links
       - name: memory_names
         kind: memory_name array
         descriptions: :tiun.resources.memory.put.memory_names
    - name: delete
      version: 0.1
      kind: memory
      descriptions: :tiun.resources.memory.delete
      auth: memory.remove
      allowed_errors: [200, 404, 422.3, 500]
      args:
       - name: uno
         kind: string
         descriptions: :tiun.resources.memory.delete.uno
 - name: memory.content
   path: /api/v0/memories/:id/content.json
   methods:
    - name: get
      version: 0.1
      kind: memory_span page
      descriptions: :tiun.resources.memory.content
      auth: no
      allowed_errors: [200, 204, 206, 416, 422.3, 500]
      args:
       - name: per
         kind: natural
         default: 10
         maximum: 50
         descriptions: :tiun.resources.memory.content.per_page
       - name: page
         kind: natural
         alias: p
         default: 1
         descriptions: :tiun.resources.memory.content.page
       - name: id
         kind: integer
         skip: args
         descriptions: :tiun.resources.memory.content.uno
       - name: calendary_slugs
         kind: string
         alias: c
         descriptions: :tiun.resources.memory.content.calendary_slugs
