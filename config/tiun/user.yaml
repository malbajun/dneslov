---
types:
 - name: short_user
   model: User
   version: 1.0
   fields:
    - name: uid
      kind: string
      descriptions: :tiun.types.short_user.uid
    - name: name
      kind: string
      descriptions: :tiun.types.short_user.name
 - name: user
   model: User
   version: 1.0
   fields:
    - name: user_names
      kind: user_name array
      descriptions: :tiun.types.user.user_names
    - name: descriptions
      kind: description array
      descriptions: :tiun.types.user.descriptions
    - name: accounts
      kind: account array
      descriptions: :tiun.types.user.accounts
 - name: account
   model: Account
   version: 1.0
   fields:
    - name: "no"
      kind: string
      descriptions: :tiun.types.account.no
    - name: type
      kind: enum <Account::Uid, Account::Email>
      descriptions: :tiun.types.account.type
    - name: validated
      kind: flag
      readonly: true
      descriptions: :tiun.types.account.validated
 - name: description
   model: Description
   version: 1.0
   fields:
    - name: id
      kind: natural
      descriptions: :tiun.types.description.id
    - name: text
      kind: string
      descriptions: :tiun.types.description.text
    - name: language_code
      kind: string
      descriptions: :tiun.types.description.language_code
    - name: language
      kind: string
      readonly: true
      descriptions: :tiun.types.description.language
    - name: alphabeth_code
      kind: string
      descriptions: :tiun.types.description.alphabeth_code
    - name: alphabeth
      kind: string
      readonly: true
      descriptions: :tiun.types.description.alphabeth
    - name: type
      kind: enum <Description>
      descriptions: :tiun.types.description.type
 - name: user_name
   model: UserName
   version: 1.0
   fields:
    - name: nomen
      kind: string
      descriptions: :tiun.types.user_name.nomen
    - name: kind
      kind: enum <NameKind::First, NameKind::Paternal, NameKind::Family>
      descriptions: :tiun.types.user_name.kind
      # kind - тип: имя фамилия/род отчество/родитель
    - name: source
      kind: enum <NameSource::Father, NameSource::Mother, NameSource::Husband, NameSource::Wife, NameSource::Foster, NameSource::Uncle, NameSource::Godfather, NameSource::Godmother, NameSource::Self, NameSource::Brotherhood, NameSource::Spiritual, NameSource::Saint, NameSource::Place, NameSource::Gest, NameSource::Property>
      descriptions: :tiun.types.user_name.source
      # source - источник: отец,мать,муж,жена,приёмный,дядя,крёстный,сам,братия,духовный,место,подвиг,свойство
    - name: link
      kind: string
      descriptions: :tiun.types.user_name.link
      # link - связанный объект: личность,место
    - name: usage
      kind: enum <NameUsage::Family, NameUsage::Church, NameUsage::Society, NameUsage::Community, NameUsage::Army, NameUsage::Czardom, NameUsage::Brotherhood, NameUsage::Sisterhood>
      descriptions: :tiun.types.user_name.usage
      # usage - использование: семья,церковь,войско,царство,братство,сестёрство
    - name: way
      kind: enum <NameWay::Appellation, NameWay::Baptism, NameWay::Sobriquet, NameWay::Self, NameWay::Rasophorus, NameWay::Monastic, NameWay::Schema, NameWay::Bless, NameWay::Dedication, NameWay::Repentance>
      descriptions: :tiun.types.user_name.way
      # way - чин: нареч,крещ,прозв,сам,рясоф,иноч,схим,благослов,посвящ,покай
    - name: main
      kind: flag
      optional: true
      descriptions: :tiun.types.user_name.main
      # main - как основное
resources:
 - name: user.index
   path: /api/v1/users.json
   methods:
    - name: get
      version: 1.0
      kind: short_user page
      descriptions: :tiun.resources.user.index
      allowed_errors: [200, 204, 206, 416, 422.3, 500]
      args:
       - name: per
         kind: natural
         default: 10 
         maximum: 50
         descriptions: :tiun.resources.user.index.args.per_page
       - name: page
         kind: natural
         default: 1
         descriptions: :tiun.resources.user.index.args.page
 - name: user.create
   path: /api/v1/users/create.json
   methods:
    - name: post
      version: 1.0
      kind: user
      descriptions: :tiun.resources.user.create
      allowed_errors: [200, 404, 422.3, 500]
      args:
       - name: "no"
         kind: string
         descriptions: :tiun.resources.user.post.no
       - name: type
         kind: enum <Account::Email>
         descriptions: :tiun.resources.user.post.type
       - name: password
         kind: string
         descriptions: :tiun.resources.user.post.password
       - name: password_confirmation
         kind: string
         descriptions: :tiun.resources.user.post.password_confirmation
       - name: default_name
         kind: string
         descriptions: :tiun.resources.user.post.default_name
       - name: user_names
         kind: user_name array
         descriptions: :tiun.resources.user.post.user_names
       - name: accounts
         kind: account array
         descriptions: :tiun.resources.user.post.accounts
 - name: user
   path: /api/v1/users/:uno.json
   methods:
    - name: get
      version: 1.0
      kind: user
      policy: [user_read]
      descriptions: :tiun.resources.user.get
      allowed_errors: [200, 404, 406, 422.3, 500]
      args:
       - name: "no"
         kind: string
         descriptions: :tiun.resources.user.get.args.no
       - name: "uno"
         kind: string
         descriptions: :tiun.resources.user.get.args.no
       - name: type
         kind: enum <Account::Uid, Account::Email>
         descriptions: :tiun.resources.user.get.args.type
    - name: put
      version: 1.0
      kind: user
      policy: [user_write]
      descriptions: :tiun.resources.user.put
      allowed_errors: [200, 401, 404, 422.3, 500]
      header:
       - name: session_token
         as: auth_token
         kind: string
         descriptions: :tiun.resources.session.put.header.session_token
      args:
       - name: "no"
         kind: string
         descriptions: :tiun.resources.user.put.args.no
       - name: "uno"
         kind: string
         descriptions: :tiun.resources.user.get.args.no
       - name: type
         kind: enum <Account::Uid, Account::Email>
         descriptions: :tiun.resources.user.put.args.type
       - name: old_password
         kind: string
         descriptions: :tiun.resources.user.put.old_password
       - name: password
         kind: string
         descriptions: :tiun.resources.user.put.password
       - name: password_confirmation
         kind: string
         descriptions: :tiun.resources.user.put.password_confirmation
       - name: default_name
         kind: string
         descriptions: :tiun.resources.user.put.default_name
       - name: user_names
         kind: user_name array
         descriptions: :tiun.resources.user.put.user_names
       - name: accounts
         kind: account array
         descriptions: :tiun.resources.user.put.accounts
    - name: delete
      version: 1.0
      kind: user
      require: auth
      policy: [user_write]
      descriptions: :tiun.resources.user.delete
      allowed_errors: [200, 401, 404, 422.3, 500]
      header:
       - name: session_token
         as: auth_token
         kind: string
         descriptions: :tiun.resources.session.put.header.session_token
      args:
       - name: "uno"
         kind: string
         descriptions: :tiun.resources.user.get.args.no
       - name: "no"
         kind: string
         descriptions: :tiun.resources.user.delete.args.no
       - name: type
         kind: enum <Account::Uid, Account::Email>
         descriptions: :tiun.resources.user.delete.args.type
