      version: 0.1
      kind: memoe page
      descriptions: :tiun.resources.memo.index
      auth: no
      allowed_errors: [200, 204, 206, 416, 422.3, 500]
      args:
       - name: per
         kind: natural
         default: 10
         maximum: 50
         descriptions: :tiun.resources.memo.index.per_page
